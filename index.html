<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conociéndonos: juego de cartas</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b2420;--mute:#7a6e66;--a:#d9734e;--b:#4e8fd9;--c:#8a5ad9;--line:#e8dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--card:#2a2420;--ink:#f3ebe4;--mute:#a89c93;--line:#3b332e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1816;--card:#2a2420;--ink:#f3ebe4;--mute:#a89c93;--line:#3b332e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
h1{font-size:1.5rem;margin:8px 0 4px;text-align:center}
.sub{color:var(--mute);font-family:system-ui,sans-serif;font-size:.9rem;text-align:center;margin:0 0 18px}
.levels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;font-family:system-ui,sans-serif}
.levels button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font-size:.85rem;cursor:pointer}
.levels button.on{color:#fff;border-color:transparent}
.card{width:100%;max-width:340px;min-height:340px;border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);cursor:pointer;transition:transform .25s}
.card:active{transform:scale(.98)}
.tag{font-family:system-ui,sans-serif;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.q{font-size:1.5rem;line-height:1.3;text-align:center;margin:20px 0}
.n{font-family:system-ui,sans-serif;font-size:.8rem;text-align:center;opacity:.85}
.ctrl{display:flex;gap:10px;margin-top:20px;font-family:system-ui,sans-serif}
.ctrl button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:12px 18px;border-radius:14px;font-size:.95rem;cursor:pointer}
.ctrl .main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{color:var(--mute);font-family:system-ui,sans-serif;font-size:.8rem;margin-top:14px;text-align:center;max-width:320px}
.box{font-family:system-ui,sans-serif;text-align:center;max-width:340px;width:100%}
.box input{padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;width:100%;margin:6px 0}
.box button{padding:12px 16px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-size:1rem;width:100%;margin:6px 0;cursor:pointer}
.box button.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.code{font-size:2.2rem;letter-spacing:.2em;font-weight:700;margin:8px 0}
.turn,.who{font-family:system-ui,sans-serif;text-align:center}
.turn{font-weight:600;margin:0 0 12px}.who{color:var(--mute);font-size:.8rem;margin:0 0 10px}
.hide{display:none!important}
.chat{font-family:system-ui,sans-serif;width:100%;max-width:340px;margin-top:18px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.chat h2{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0;padding:10px 14px;border-bottom:1px solid var(--line)}
#msgs{height:200px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;font-size:.92rem;line-height:1.35;word-wrap:break-word}
.m small{display:block;font-size:.7rem;opacity:.7;margin-bottom:2px}
.m.me{align-self:flex-end;background:var(--ink);color:var(--bg)}
.m.th{align-self:flex-start;background:var(--line);color:var(--ink)}
.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.cin input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
.cin button{padding:10px 14px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font-size:.95rem;cursor:pointer}
</style>
</head>
<body>
<h1>Conociéndonos</h1>
<p class="sub">50 preguntas · por turnos · con chat</p>
<div class="box" id="start">
<input id="nm" maxlength="20" placeholder="Tu nombre">
<button id="mk">Crear sala</button>
<input id="cd" maxlength="4" inputmode="numeric" placeholder="Código de 4 dígitos">
<button class="alt" id="jn">Unirme a una sala</button>
<p class="hint" id="msg"></p>
</div>
<div class="box hide" id="wait"><p>Pásale este código a la otra persona:</p><div class="code" id="code"></div><p class="hint">Esperando a que se una…</p></div>
<div id="game" class="hide" style="display:flex;flex-direction:column;align-items:center;width:100%">
<div class="who" id="who"></div><div class="levels" id="lv"></div><div class="turn" id="turn"></div>
<div class="card" id="card"><div class="tag" id="tag"></div><div class="q" id="q"></div><div class="n" id="n"></div></div>
<div class="ctrl"><button id="shuf">Nueva partida</button><button class="main" id="next">Siguiente →</button></div>
<p class="hint">Respondan como su personaje. Quien tiene el turno lee la carta y responde primero; después responde la otra persona. Al terminar, toquen "Siguiente".</p>
<div class="chat"><h2>Chat</h2><div id="msgs"></div>
<div class="cin"><input id="ci" maxlength="300" placeholder="Escribe tu respuesta…" enterkeyhint="send"><button id="cs">Enviar</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const L=[
{n:"Nivel 1 · Primeras impresiones",c:"#d9734e",q:["¿Qué fue lo primero que pensaste de mí cuando me conociste?","¿Qué fue lo que más te llamó la atención de mí?","¿Cómo describirías mi forma de ser en tres palabras?","¿Qué es lo que más te hace reír de mí?","¿Qué momento nuestro recuerdas con más cariño hasta ahora?","¿Cuál dirías que es mi mayor virtud?","¿Cuál es esa manía mía que te parece adorable?","¿Qué canción te recuerda a mí?","¿Cómo sería una cita perfecta conmigo?","¿Qué haces cuando me extrañas?","¿Qué te gusta que haga cuando estamos juntos?","¿Qué apodo cariñoso me pondrías y por qué?","¿Qué lugar te gustaría que visitáramos juntos?","¿Eres más de mimos, de palabras o de detalles? ¿Cómo lo demuestras?","¿Qué sientes cuando me ves llegar?","¿Qué plan tranquilo disfrutarías hacer conmigo en casa?","¿Cuál es tu comida favorita para compartir conmigo?","¿Qué te gustaría que supiera de tu día a día?"]},
{n:"Nivel 2 · Cómo pensamos",c:"#4e8fd9",q:["¿Cómo te das cuenta de que estás enamorado(a)?","¿Qué es lo que más valoras en una relación?","Cuando discutimos, ¿prefieres hablarlo al momento o con calma?","¿Qué te hace sentir más querido(a) por mí?","¿Qué cosas te ponen celoso(a), si es que alguna?","¿Cómo manejas el enojo o el estrés?","¿Piensas mucho las cosas o te dejas llevar por lo que sientes?","¿Qué es lo que más te cuesta decirme?","¿Qué necesitas de mí cuando tienes un mal día?","¿Qué significa la confianza para ti?","¿Qué piensas del amor a primera vista?","¿Qué cosas no negociarías en una relación?","¿Qué cosas te dan ternura?","¿Cuál es tu lenguaje del amor?","¿Prefieres los detalles pequeños de cada día o las grandes sorpresas?","¿Qué te hace sentir seguro(a) conmigo?","¿Cómo quieres que te cuide cuando estás cansado(a) o enfermo(a)?","¿En qué piensas cuando estás solo(a) y te acuerdas de mí?"]},
{n:"Nivel 3 · Entre nosotros",c:"#8a5ad9",q:["¿Qué es lo más lindo que te he dicho o hecho?","¿Qué te gustaría que hiciéramos más seguido?","¿Qué cosa tuya quisieras que yo entendiera mejor?","¿Cuál es tu secreto más tonto o gracioso?","¿Qué es lo que más temes perder en una relación?","¿Qué te hace sentir en casa conmigo?","¿Qué recuerdo de tu infancia me contarías hoy?","Dime algo que nunca me has dicho en voz alta.","¿Qué es lo que más agradeces de que estemos juntos?","¿Cómo describirías lo que sentimos con una sola palabra?","¿Qué locura harías por mí?","¿Qué te gustaría que nunca cambie entre nosotros?","¿Qué has aprendido de mí desde que nos conocemos?","Cierre: dime tres cosas que amas de mí."]}
];

const $=id=>document.getElementById(id);
const flat=[];L.forEach((l,k)=>l.q.forEach(t=>flat.push({t,k})));
let S=null,conn=null,peer=null,role=0,names=["",""];
const PFX="conoc-juego-";
function order(lvl){return L.map((l,k)=>flat.map((_,i)=>i).filter(i=>(lvl<0||lvl===k)&&flat[i].k===k).sort(()=>Math.random()-.5)).flat()}
function fresh(lvl){return{lvl,order:order(lvl),pos:0,turn:0,p:names.slice()}}
function push(){if(conn&&conn.open)conn.send(S)}
function save(patch){S=Object.assign({},S,patch);render();push()}
function render(){
  const d=flat[S.order[S.pos]],l=L[d.k];
  $("card").style.background=l.c;$("tag").textContent=l.n;$("q").textContent=d.t;
  $("n").textContent=(S.pos+1)+" / "+S.order.length;
  $("turn").textContent="Primero responde: "+(S.p[S.turn]||"Jugador "+(S.turn+1));
  $("who").textContent=S.p[0]+" y "+S.p[1]+" están conectados";
  const lv=$("lv");lv.innerHTML="";
  [["Todas",-1,"#2b2420"],...L.map((x,k)=>[x.n.split(" · ")[0],k,x.c])].forEach(([t,k,c])=>{
    const b=document.createElement("button");b.textContent=t;
    if(S.lvl===k){b.className="on";b.style.background=c}
    b.onclick=()=>save(fresh(k));lv.appendChild(b)});
}
function begin(){$("start").classList.add("hide");$("wait").classList.add("hide");$("game").classList.remove("hide");render()}
function wire(c){
  conn=c;
  c.on("data",d=>{
    if(d&&d.chat){addMsg(d.from,d.chat,false);return}
    if(d&&d.hello){names[1]=d.hello;S=fresh(-1);S.p=names.slice();begin();push();return}
    S=d;if(!names[1-role]&&S.p)names=S.p.slice();begin()});
  c.on("close",()=>{$("msg").textContent="";$("who").textContent="La otra persona se desconectó. Recarga para volver a empezar."});
}
$("mk").onclick=()=>{
  names[0]=$("nm").value.trim()||"Jugador 1";role=0;
  const code=String(Math.floor(1000+Math.random()*9000));
  peer=new Peer(PFX+code);
  peer.on("open",()=>{$("code").textContent=code;$("start").classList.add("hide");$("wait").classList.remove("hide")});
  peer.on("connection",wire);
  peer.on("error",e=>{$("msg").textContent=e.type==="unavailable-id"?"Ese código ya existe, intenta otra vez.":"Error de conexión: "+e.type});
};
$("jn").onclick=()=>{
  const n=$("nm").value.trim()||"Jugador 2",code=$("cd").value.trim();
  if(code.length!==4){$("msg").textContent="Escribe el código de 4 dígitos.";return}
  role=1;names[1]=n;$("msg").textContent="Conectando…";
  peer=new Peer();
  peer.on("open",()=>{const c=peer.connect(PFX+code,{reliable:true});wire(c);c.on("open",()=>c.send({hello:n}))});
  peer.on("error",e=>{$("msg").textContent=e.type==="peer-unavailable"?"No encontré esa sala. Revisa el código.":"Error de conexión: "+e.type});
};
function addMsg(who,txt,mine){
  const m=document.createElement("div");m.className="m "+(mine?"me":"th");
  const a=document.createElement("small");a.textContent=mine?"Tú":who;
  const b=document.createElement("span");b.textContent=txt;
  m.append(a,b);const box=$("msgs");box.appendChild(m);box.scrollTop=box.scrollHeight;
}
function sendMsg(){
  const i=$("ci"),t=i.value.trim();
  if(!t||!conn||!conn.open)return;
  conn.send({chat:t,from:names[role]||"Jugador"});addMsg("",t,true);i.value="";
}
$("cs").onclick=sendMsg;
$("ci").onkeydown=e=>{if(e.key==="Enter")sendMsg()};
$("next").onclick=$("card").onclick=()=>{if(S)save({pos:(S.pos+1)%S.order.length,turn:1-S.turn})};
$("shuf").onclick=()=>{if(S)save(fresh(S.lvl))};
</script>
</body>
</html>
